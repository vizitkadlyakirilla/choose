<!doctype html>
<html lang="ru" data-concept="4" data-base="../../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кирилл · Кино по скроллу · Вариант 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Golos+Text:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/present.css">
<style>
:root{--ink:#e9e6df;--sub:#f5d90a;--dim:#8f8b82}
*{box-sizing:border-box}
body{margin:0;background:#000;color:var(--ink);font:16px/1.5 'Golos Text',system-ui,sans-serif}
a{color:inherit}
:focus-visible{outline:2px solid var(--sub);outline-offset:3px}
.os{font-family:'Old Standard TT',serif}
/* fixed chrome */
.brand{position:fixed;left:24px;top:20px;z-index:20;font:700 15px 'Old Standard TT';letter-spacing:.2em;text-decoration:none;mix-blend-mode:difference}
.chap{position:fixed;right:70px;top:16px;z-index:20;min-height:44px;padding:0 16px;border:1px solid rgba(233,230,223,.5);background:rgba(0,0,0,.4);color:var(--ink);font:600 13px 'Golos Text';letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.chap:hover{background:var(--ink);color:#000}
.strip{position:fixed;right:0;top:0;bottom:0;width:46px;z-index:20;background:#0b0b0b;border-left:1px solid #222;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:10px 6px}
.strip::before,.strip::after{content:"";position:absolute;top:0;bottom:0;width:6px;background:repeating-linear-gradient(180deg,#000 0 6px,transparent 6px 12px)}
.strip::before{left:2px}.strip::after{right:2px}
.strip a{position:relative;display:block;height:clamp(16px,3vh,30px);margin:0 6px;background:#1c1c1c;border:1px solid #333;transition:background .3s}
.strip a.part{background:#2b2618;border-color:#5a4e25}
.strip a:hover{background:#555}
.strip a[aria-current]{background:var(--sub);border-color:var(--sub)}
.strip a span{position:absolute;right:42px;top:50%;transform:translateY(-50%);white-space:nowrap;background:#000;padding:4px 8px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s}
.strip a:hover span,.strip a:focus-visible span{opacity:1}
.cursor{position:fixed;left:0;top:0;z-index:30;width:92px;height:92px;margin:-46px 0 0 -46px;border-radius:50%;border:1px solid var(--ink);display:flex;align-items:center;justify-content:center;font:600 11px 'Golos Text';letter-spacing:.14em;text-transform:uppercase;pointer-events:none;opacity:0;transform:scale(.5);transition:opacity .25s,transform .35s cubic-bezier(.2,.8,.1,1);mix-blend-mode:difference}
.cursor.on{opacity:1;transform:scale(1)}
/* opening */
.open{height:220vh;position:relative}
.open .stick{position:sticky;top:0;height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center}
.open .iris{position:absolute;inset:0;background:url(../../assets/posters/petlya.jpg) center/cover;clip-path:circle(var(--r,0%) at 50% 50%)}
.it-card{position:relative;text-align:center;padding:clamp(28px,5vw,60px) clamp(28px,6vw,90px);border:3px double var(--ink);outline:1px solid var(--ink);outline-offset:8px;background:#000;max-width:min(760px,86vw)}
.it-card p{margin:0}
.it-card .t1{font:italic 400 clamp(18px,2vw,26px) 'Old Standard TT';color:var(--dim)}
.it-card .t2{font:700 clamp(54px,10vw,150px)/.9 'Old Standard TT';letter-spacing:.04em;margin:.12em 0}
.it-card .t3{font:400 clamp(16px,1.8vw,24px) 'Old Standard TT';letter-spacing:.3em;text-transform:uppercase}
.hint{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,6px)}}
/* parts & scenes */
.part{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:80px 70px 80px 24px}
.part .it-card{opacity:.0;transform:scale(.94);transition:opacity 1s,transform 1.2s cubic-bezier(.2,.8,.1,1)}
.part .it-card.is-in{opacity:1;transform:none}
.part .flick{animation:flick 4s steps(1) infinite}
@keyframes flick{0%,96%{opacity:1}97%{opacity:.7}98%{opacity:1}99%{opacity:.85}}
.scene{height:190vh;position:relative}
.scene .stick{position:sticky;top:0;height:100vh;overflow:hidden;cursor:none}
.scene img,.scene video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(var(--z,1.3));transform-origin:var(--ox,50%) 45%;will-change:transform;filter:brightness(var(--b,.5))}
.scene .fit{object-fit:contain}
.scene .lb{position:absolute;left:0;right:0;height:var(--lb,50vh);background:#000;z-index:1}
.scene .lb.t{top:0}.scene .lb.b{bottom:0}
.scene .slate{position:absolute;left:24px;top:22px;z-index:2;font:600 12px 'Golos Text';letter-spacing:.18em;text-transform:uppercase;opacity:var(--o1,0);margin:0;padding-left:64px}
.scene .subs{position:absolute;left:0;right:46px;bottom:9vh;z-index:2;text-align:center;padding:0 24px}
.scene .subs p{margin:0 auto 6px;max-width:900px;font:600 clamp(20px,2.4vw,34px)/1.25 'Golos Text';color:var(--sub);text-shadow:0 2px 0 #000,0 0 12px rgba(0,0,0,.9);opacity:var(--o,0);transform:translateY(calc((1 - var(--o,0)) * 14px))}
.scene .subs p.s2{opacity:var(--o2,0);color:var(--ink)}
.scene .big{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;pointer-events:none}
.scene .big h2{margin:0;font:700 clamp(48px,11vw,190px)/.85 'Old Standard TT';letter-spacing:.02em;text-align:center;color:transparent;-webkit-text-stroke:1.5px var(--ink);opacity:var(--o3,0);transform:scale(calc(1.2 - var(--o3,0) * .2))}
.scene button.hit{position:absolute;inset:0;z-index:3;background:transparent;border:0;cursor:none}
.scene button.hit:focus-visible{outline:3px solid var(--sub);outline-offset:-6px}
/* epilogue */
.epi{min-height:100vh;padding:110px 70px 80px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px}
form.letter{width:min(720px,100%);font-family:'Old Standard TT',serif;font-size:19px;display:flex;flex-direction:column;gap:14px}
.letter label{display:flex;flex-direction:column;gap:4px;font:italic 15px 'Old Standard TT';color:var(--dim)}
.letter input,.letter select,.letter textarea{font:19px 'Old Standard TT';color:var(--ink);background:transparent;border:0;border-bottom:1px solid #555;padding:8px 0}
.letter select option{color:#000}
.letter input:focus,.letter textarea:focus{outline:0;border-color:var(--sub)}
.row{display:flex;flex-wrap:wrap;gap:10px}
.btn{min-height:48px;padding:0 22px;border:1px solid var(--ink);background:transparent;color:var(--ink);font:600 13px 'Golos Text';letter-spacing:.14em;text-transform:uppercase;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--ink);color:#000}
.btn.y{background:var(--sub);color:#000;border-color:var(--sub)}
.btn.y:hover{background:var(--ink);border-color:var(--ink)}
[data-kp-status]{margin:0;color:var(--sub);font:15px 'Golos Text'}
.note{color:var(--dim);font:13px 'Golos Text'}
.end{text-align:center;font:italic 400 clamp(40px,6vw,90px) 'Old Standard TT';margin:0}
/* chapters overlay */
.menu{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center}
.menu[hidden]{display:none}
.menu ol{list-style:none;margin:0;padding:0;text-align:center;counter-reset:c}
.menu a{display:block;padding:8px 16px;font:400 clamp(24px,3.4vw,44px) 'Old Standard TT';text-decoration:none}
.menu a:hover{color:var(--sub);font-style:italic}
.menu small{display:block;font:600 11px 'Golos Text';letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
.menu .x{position:absolute;top:16px;right:16px}
/* cinema overlay */
.cin{position:fixed;inset:0;z-index:80;background:#000;display:grid;grid-template-columns:minmax(0,1fr) 360px}
.cin[hidden]{display:none}
.cin .m{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;border-top:9vh solid #000;border-bottom:9vh solid #000}
.cin .m img{width:100%;height:100%;object-fit:cover;animation:kb 14s ease-out both}
.cin .m .kp-player{width:100%;height:100%}
@keyframes kb{from{transform:scale(1.12)}to{transform:scale(1)}}
.cin aside{border-left:1px solid #222;padding:70px 28px 28px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.cin h3{margin:0;font:700 clamp(32px,3vw,48px)/1 'Old Standard TT'}
.cr{list-style:none;margin:0;padding:0;font:15px 'Old Standard TT'}
.cr li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dotted #444}
.cr li span:first-child{color:var(--dim);font-style:italic}
.cin .x{position:absolute;top:14px;right:14px;z-index:2}
@media (max-width:820px){
  .strip{top:auto;left:0;right:0;bottom:0;width:auto;height:8px;flex-direction:row;padding:0;gap:2px}
  .strip::before,.strip::after{display:none}
  .strip a{flex:1;height:8px;margin:0;border:0}
  .strip a span{display:none}
  .chap{right:14px}
  .part,.epi{padding-right:20px;padding-left:20px}
  .scene{height:160vh}
  .scene .subs{right:0;bottom:12vh}
  .scene .stick,.scene button.hit{cursor:pointer}
  .cursor{display:none}
  .cin{grid-template-columns:1fr;grid-template-rows:50vh 1fr}
  .cin .m{border-width:4vh}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.part .it-card{opacity:1;transform:none}}
</style>
</head>
<body>
<a class="brand" href="#start">К·Б</a>
<button class="chap" type="button" id="chapBtn" aria-haspopup="dialog">Части фильма</button>
<nav class="strip" id="strip" aria-label="Плёнка: сцены и части"></nav>
<div class="cursor" id="cursor" aria-hidden="true">Смотреть</div>

<main id="film">
  <section class="open" id="start" aria-label="Вступление">
    <div class="stick"><div class="iris" id="iris"></div>
      <div class="it-card" id="title"><p class="t1">Кирилл Буланов представляет</p><p class="t2">Кирилл</p><p class="t3">режиссёр · сценарист · AI</p></div>
      <p class="hint">Листайте — фильм начнётся</p>
    </div>
  </section>
</main>

<div class="menu" id="menu" role="dialog" aria-modal="true" aria-label="Части фильма" hidden>
  <button class="btn x" type="button" data-close>Закрыть ×</button>
  <ol id="menuList"></ol>
</div>

<div class="cin" id="cin" role="dialog" aria-modal="true" aria-labelledby="cint" hidden>
  <button class="btn x" type="button" data-close>Закрыть ×</button>
  <div class="m" id="cinm"></div>
  <aside><p class="note" id="cink" style="letter-spacing:.18em;text-transform:uppercase;margin:0"></p><h3 id="cint"></h3><ul class="cr" id="cinf"></ul><p class="note" id="cinn"></p>
  <div class="row"><a class="btn y" id="cins" target="_blank" rel="noopener">Смотреть оригинал ↗</a><button class="btn" id="cinnext" type="button">Следующая сцена →</button></div></aside>
</div>

<script src="../../assets/videos/manifest.js"></script>
<script src="../../js/data.js"></script>
<script src="../../js/config.js"></script>
<script src="../../js/common.js"></script>
<script src="../../js/present.js"></script>
<script>
(function(){
  var $ = KP.qs, W = KP.works, film = $('#film');
  var place = { gornaya:'ИНТ. СПОРТЗАЛ', ahmad:'НАТ. КАТОК — НОЧЬ', twinby:'ИНТ. КУХНЯ — ВЕЧЕР', aliexpress:'ИНТ. ВАННАЯ — УТРО', dodo:'НАТ. ГОРОД — ВЕЧЕР', bupas:'ИНТ. ЗАЛ — ДЕНЬ', petlya:'НАТ. ЗИМНИЙ ЛЕС — НОЧЬ', istoriya:'ИНТ. КВАРТИРА — НОЧЬ', parody:'ИНТ. ПРИХОЖАЯ — ДЕНЬ', navsyu:'ИНТ. КУХНЯ — НОЧЬ' };
  var parts = [
    { id:'p1', n:'Часть первая', t:'Реклама', cat:'ads' },
    { id:'p2', n:'Часть вторая', t:'Кино', cat:'film' },
    { id:'p3', n:'Часть третья', t:'Опыты', cat:'exp' },
    { id:'p4', n:'Часть четвёртая', t:'Слова', body:'Здесь будут сценарии, синопсисы и концепции Кирилла.<br><i>Демо-ограничение: материалы ещё не получены.</i>' },
    { id:'p5', n:'Часть пятая', t:'Машины', body:'Здесь будут AI-работы.<br><i>Демо-ограничение: материалы ещё не предоставлены.</i>', flick:true }
  ];
  var html = '', sn = 0, nav = [];
  nav.push({href:'#start', label:'Вступление', part:true});
  parts.forEach(function(p){
    html += '<section class="part" id="'+p.id+'"><div class="it-card'+(p.flick?' flick':'')+'"><p class="t1">'+p.n+'</p><p class="t2" style="font-size:clamp(48px,8vw,120px)">'+p.t+'</p>'+(p.body?'<p class="t1" style="margin-top:14px;color:var(--ink);font-style:normal">'+p.body+'</p>':'')+'</div></section>';
    nav.push({href:'#'+p.id, label:p.n+'. '+p.t, part:true});
    if (p.cat) W.filter(function(w){ return w.cat===p.cat; }).forEach(function(w){
      sn++; var fit = w.aspect.indexOf('16:9')<0;
      html += '<section class="scene" id="s-'+w.id+'" data-id="'+w.id+'"><div class="stick">'+
        (KP.previewSrc(w) ? '<video class="sv '+(fit?'fit':'')+'" poster="'+KP.posterOf(w,0)+'" src="'+KP.previewSrc(w)+'" loop aria-label="'+KP.esc(w.alt[0])+'"></video>' : '<img src="'+KP.poster(w.posters[0])+'" alt="'+KP.esc(w.alt[0])+'" class="'+(fit?'fit':'')+'" loading="lazy">')+
        '<div class="lb t"></div><div class="lb b"></div>'+
        '<p class="slate">Сцена '+sn+'. '+place[w.id]+'</p>'+
        '<div class="big" aria-hidden="true"><h2>'+KP.esc(w.title.replace(/[«»]/g,''))+'</h2></div>'+
        '<div class="subs"><p>'+KP.esc(w.title)+' — '+KP.esc(w.kind.toLowerCase())+'</p><p class="s2">'+KP.esc([w.dur, w.client].filter(Boolean).join(' · '))+'</p></div>'+
        '<button class="hit" type="button" data-open="'+w.id+'" aria-label="Смотреть: '+KP.esc(w.title)+'"></button></div></section>';
      nav.push({href:'#s-'+w.id, label:'Сцена '+sn+'. '+w.title});
    });
  });
  html += '<section class="epi" id="epi"><div class="it-card" style="opacity:1"><p class="t1">Эпилог</p><p class="t2" style="font-size:clamp(44px,7vw,100px)">Письмо режиссёру</p></div>'+
    '<form class="letter" data-kp-contact><label>Как к вам обращаться<input name="name"></label><label>Как ответить<input name="contact" placeholder="Telegram, телефон или почта"></label>'+
    '<label>Жанр будущей работы<select name="project"><option>Реклама</option><option>Кино</option><option>Клип</option><option>AI-проект</option><option>Сценарий</option></select></label>'+
    '<label>Синопсис вашей задачи<textarea name="message" rows="4"></textarea></label>'+
    '<div class="row"><button class="btn y" data-act="tg" type="button">Отправить в Telegram</button><button class="btn" data-act="mail" type="button">Письмом</button><button class="btn" data-act="copy" type="button">Скопировать</button></div>'+
    '<p data-kp-status role="status" aria-live="polite" hidden></p><p class="note">Контакты Кирилла добавим после согласования — пока Telegram откроет выбор чата.</p></form><p class="end">Конец.</p></section>';
  nav.push({href:'#epi', label:'Эпилог. Письмо режиссёру', part:true});
  film.insertAdjacentHTML('beforeend', html);
  KP.qsa('video.sv').forEach(KP.registerBg);
  $('#strip').innerHTML = nav.map(function(n){ return '<a href="'+n.href+'"'+(n.part?' class="part"':'')+'><span>'+KP.esc(n.label)+'</span></a>'; }).join('');
  $('#menuList').innerHTML = nav.filter(function(n){return n.part;}).map(function(n){ var s=n.label.split('. '); return '<li><a href="'+n.href+'">'+(s[1]?'<small>'+s[0]+'</small>'+s.slice(1).join('. '):n.label)+'</a></li>'; }).join('');

  /* меню частей */
  var menu = $('#menu'), MM = KP.modal(menu);
  $('#chapBtn').addEventListener('click', MM.open);
  KP.qsa('a', menu).forEach(function(a){ a.addEventListener('click', MM.close); });

  /* кинозал */
  var cin = $('#cin'), CM = KP.modal(cin), cur;
  function openW(id){ var w = KP.byId(id); cur = w;
    $('#cinm').innerHTML = KP.mediaHTML(w); $('#cink').textContent = w.kind; $('#cint').textContent = w.title;
    $('#cinf').innerHTML = [['Заказчик',w.client],['Длительность',w.dur||'уточняется'],['Кадр',w.aspect],['Загружено',w.upload],['Режиссёр','Кирилл (роль уточняется)']].map(function(r){ return '<li><span>'+r[0]+'</span><span>'+KP.esc(r[1])+'</span></li>'; }).join('');
    $('#cinn').textContent = [w.note, KP.sourceNote(w)].filter(Boolean).join(' '); $('#cins').href = w.source;
    if (cin.hidden) CM.open(); else KP.startPlayer(cin); }
  KP.qsa('[data-open]').forEach(function(b){ b.addEventListener('click', function(){ openW(b.dataset.open); }); });
  $('#cinnext').addEventListener('click', function(){ var k = W.indexOf(cur); openW(W[(k+1)%W.length].id); });

  /* курсор */
  var cu = $('#cursor');
  addEventListener('mousemove', function(e){ cu.style.left=e.clientX+'px'; cu.style.top=e.clientY+'px'; cu.classList.toggle('on', !!e.target.closest('.scene')); }, {passive:true});

  /* скролл-режиссура */
  var scenes = KP.qsa('.scene'), cards = KP.qsa('.part .it-card'), links = KP.qsa('#strip a'), iris = $('#iris'), title = $('#title'), open = $('#start');
  function clamp(v){ return Math.max(0, Math.min(1, v)); }
  function frame(){
    var vh = innerHeight;
    var ro = open.getBoundingClientRect(), po = clamp(-ro.top / (ro.height - vh));
    iris.style.setProperty('--r', (po*80).toFixed(1)+'%'); title.style.opacity = (1 - clamp((po-.35)/.4)).toFixed(2);
    title.style.transform = 'scale('+(1 - po*.15).toFixed(3)+')';
    scenes.forEach(function(s){
      var r = s.getBoundingClientRect(); if (r.bottom < -50 || r.top > vh + 50) return;
      var p = clamp(-r.top / (r.height - vh)), st = s.style;
      st.setProperty('--z', (1.32 - .32*clamp(p*1.6)).toFixed(3));
      st.setProperty('--lb', (50 - 38*clamp(p*2.2)).toFixed(1)+'vh');
      st.setProperty('--b', (.35 + .65*clamp(p*2)).toFixed(2));
      st.setProperty('--o1', clamp((p-.1)*4).toFixed(2));
      st.setProperty('--o3', (clamp(p*3) * (1-clamp((p-.35)*4))).toFixed(2));
      st.setProperty('--o', clamp((p-.45)*5).toFixed(2));
      st.setProperty('--o2', clamp((p-.6)*5).toFixed(2));
    });
    var best = 0, bd = 1e9;
    links.forEach(function(a,k){ var el = $(a.getAttribute('href')); if(!el) return; var d = Math.abs(el.getBoundingClientRect().top); if (el.getBoundingClientRect().top <= vh*.5 && d < bd){ bd=d; best=k; } });
    links.forEach(function(a,k){ a.toggleAttribute('aria-current', k===best); });
  }
  var ticking = false;
  function onScroll(){ if(!ticking){ ticking=true; requestAnimationFrame(function(){ frame(); ticking=false; }); } }
  if (KP.reduced) { scenes.forEach(function(s){ ['--z:1','--lb:12vh','--b:1','--o1:1','--o:1','--o2:1','--o3:0'].forEach(function(v){ var a=v.split(':'); s.style.setProperty(a[0],a[1]); }); }); iris.style.setProperty('--r','80%'); }
  else { addEventListener('scroll', onScroll, {passive:true}); addEventListener('resize', onScroll); frame(); }
  if ('IntersectionObserver' in window) { var io = new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting) e.target.classList.add('is-in'); }); }, {threshold:.3}); cards.forEach(function(c){ io.observe(c); }); } else cards.forEach(function(c){ c.classList.add('is-in'); });

  KP.wireContact($('[data-kp-contact]'), 'Кино по скроллу');
})();
</script>
</body>
</html>
